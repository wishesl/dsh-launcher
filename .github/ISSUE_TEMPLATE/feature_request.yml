name: 功能建议
description: 提出新功能或对现有功能的改进
title: "[feat] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题
      description: 描述场景与痛点，而不是先给方案 —— "我在做 X 时总是遇到 Y"最有用。
      placeholder: 每次切换实例都要手动去目录里翻 node_modules，…
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望的做法（可选）
      placeholder: 如果实例卡片上能直接显示本地副本版本就好了…

  - type: textarea
    id: alternatives
    attributes:
      label: 目前的替代方案（可选）
      placeholder: 现在靠打开版本页对照 npm latest 手动判断…

  - type: checkboxes
    id: layout
    attributes:
      label: 涉及界面的提案请确认
      options:
        - label: 我理解新增的进度 / 日志输出必须进右侧第三栏，不能做覆盖式抽屉（见 AGENTS.md §0）
