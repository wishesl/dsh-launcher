name: release

# 推送 v* 标签（如 v0.1.0）即自动编译 Windows / macOS / Linux 三端产物并发布到 GitHub Releases。
# 用法：git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            artifact: dsh-launcher-windows-amd64.exe
            goarch: amd64
            wails_tags: ''
          - name: macOS arm64
            os: macos-latest
            artifact: dsh-launcher-darwin-arm64.zip
            goarch: arm64
            wails_tags: ''
          - name: macOS x64
            os: macos-latest
            artifact: dsh-launcher-darwin-amd64.zip
            # macos-13（Intel runner）已被 GitHub 下线，改在 arm64 runner 上用
            # GOARCH=amd64 交叉编译（Xcode 通用工具链支持）
            goarch: amd64
            wails_tags: ''
          - name: Linux x64
            os: ubuntu-latest
            artifact: dsh-launcher-linux-amd64.tar.gz
            goarch: amd64
            # Wails v2.15.0 默认仍要 webkit2gtk-4.0（Ubuntu 24.04 已移除）；
            # webkit2_41 标签切换到 4.1 + libsoup-3.0
            wails_tags: '-tags webkit2_41'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: dsh-launcher/frontend/package-lock.json

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # Wails v2.15.0 + webkit2_41 标签 → webkit2gtk-4.1 + libsoup-3.0（Ubuntu 24.04 已移除 4.0 包）
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev libayatana-appindicator3-dev librsvg2-dev libxkbcommon-dev

      - name: Install Wails CLI (v2.15.0)
        shell: bash
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Wails Build
        working-directory: dsh-launcher
        shell: bash
        env:
          GOARCH: ${{ matrix.goarch }}
          # 标签名（如 v0.5.0）。下面去掉前缀 v 后经 -ldflags 注入 main.version ——
          # 不注入的话顶栏品牌区的版本 pill 会一直显示 "dev"（那是本地构建的标记）。
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          echo "Building dsh-launcher $VERSION"
          wails build -clean ${{ matrix.wails_tags }} -ldflags "-X main.version=$VERSION"

      - name: Package Windows exe
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item dsh-launcher/build/bin/dsh-launcher.exe ${{ matrix.artifact }} -Force

      - name: Package macOS app
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cd dsh-launcher/build/bin
          # 用 ditto 而不是 zip：.app 里有符号链接（Frameworks 的 Versions/Current 之类），
          # `zip -r` 会把链接展开成实体文件、权限位也可能丢；启动器的应用内更新要解包这个包，
          # ditto 是 macOS 上打 .app 的标准做法（保留符号链接 / 权限位 / 资源分叉）。
          ditto -c -k --sequesterRsrc --keepParent dsh-launcher.app ../../../${{ matrix.artifact }}

      - name: Package Linux binary
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cd dsh-launcher/build/bin
          tar -czf ../../../${{ matrix.artifact }} dsh-launcher

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # 启动器应用内更新（update.go）按 SHA256SUMS 校验下载到的二进制：没有这个资产时
      # 更新器会拒绝安装（宁可让用户走「打开 Release 页」，也不用没校验的 exe）。
      # 必须在下载之后、发布之前生成，并且只对 dsh-launcher-* 取哈希（避免把自己算进去）。
      - name: Generate SHA256SUMS
        working-directory: dist
        run: |
          sha256sum dsh-launcher-* > SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
