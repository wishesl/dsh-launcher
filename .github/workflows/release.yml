name: release

# 推送 v* 标签（如 v0.1.0）即自动编译 Windows / macOS / Linux 三端产物并发布到 GitHub Releases。
# 用法：git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            artifact: dsh-launcher-windows-amd64.exe
          - name: macOS arm64
            os: macos-latest
            artifact: dsh-launcher-darwin-arm64.zip
          - name: macOS x64
            os: macos-13
            artifact: dsh-launcher-darwin-amd64.zip
          - name: Linux x64
            os: ubuntu-latest
            artifact: dsh-launcher-linux-amd64.tar.gz

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: dsh-launcher/frontend/package-lock.json

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # Wails v2.10.2 需要 webkit2gtk-4.0（pkg-config webkit2gtk-4.0）；4.1 一并装上兼容新版
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxkbcommon-dev

      - name: Install Wails CLI (v2.10.2)
        shell: bash
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.10.2
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Wails Build
        working-directory: dsh-launcher
        shell: bash
        run: wails build -clean

      - name: Package Windows exe
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item dsh-launcher/build/bin/dsh-launcher.exe ${{ matrix.artifact }} -Force

      - name: Package macOS app
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cd dsh-launcher/build/bin
          zip -r -q ../../../${{ matrix.artifact }} dsh-launcher.app

      - name: Package Linux binary
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cd dsh-launcher/build/bin
          tar -czf ../../../${{ matrix.artifact }} dsh-launcher

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
