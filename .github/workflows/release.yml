name: release

# 推送 v* 标签（如 v0.1.0）即自动编译 Windows 版并发布到 GitHub Releases。
# 用法：git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows & Publish Release
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: dsh-launcher/frontend/package-lock.json

      - name: Install Wails CLI (v2.10.2)
        shell: bash
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.10.2
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Wails Build
        working-directory: dsh-launcher
        shell: bash
        run: wails build -clean

      - name: Package ZIP
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          Compress-Archive -Path dsh-launcher/build/bin/dsh-launcher.exe `
            -DestinationPath "dsh-launcher-$tag-windows-amd64.zip" -Force

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dsh-launcher/build/bin/dsh-launcher.exe
            dsh-launcher-${{ github.ref_name }}-windows-amd64.zip
